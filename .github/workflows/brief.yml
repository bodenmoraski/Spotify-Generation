name: daily-brief
on:
  schedule:
    # 11:20 UTC ≈ 07:20 America/New_York in EDT (06:20 EST). GH cron is best-effort (10–30+ min late).
    - cron: "20 11 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build & publish brief
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRIEF_TIMEZONE: America/New_York
        run: python -m brief.run
      - name: Commit state
        run: |
          git config user.name "brief-bot"
          git config user.email "bot@local"
          git add brief/state/*.json docs/ || true
          git commit -m "brief $(date -u +%F)" || echo "no changes"
          git push
      - name: Heartbeat note
        if: success()
        run: |
          echo "Healthchecks ping is sent in-process by brief.run after a fresh brief only."
          echo "Silent-safe recover exits 0 but does not ping, so the dead-man's-switch still fires."
