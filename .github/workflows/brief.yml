name: daily-brief
on:
  schedule:
    # 11:20 UTC ≈ 07:20 America/New_York in EDT (06:20 EST). GH cron is best-effort (10–30+ min late).
    - cron: "20 11 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[tts]"
      - name: Install save-to-spotify
        run: |
          curl -fsSL https://saveto.spotify.com/install.sh | bash -s -- --no-skills
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Restore Save to Spotify credentials
        if: ${{ secrets.STS_TOKEN_B64 != '' && secrets.STS_DPOP_KEY_B64 != '' }}
        run: |
          mkdir -p ~/.config/save-to-spotify
          printf '%s' "${{ secrets.STS_TOKEN_B64 }}" | base64 -d > ~/.config/save-to-spotify/token.json
          printf '%s' "${{ secrets.STS_DPOP_KEY_B64 }}" | base64 -d > ~/.config/save-to-spotify/dpop_key.json
          chmod 600 ~/.config/save-to-spotify/token.json ~/.config/save-to-spotify/dpop_key.json
      - name: Build & publish brief
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRIEF_TIMEZONE: America/New_York
          GITHUB_PAGES_HOST: https://bodenmoraski.github.io/Spotify-Generation
          SAVE_TO_SPOTIFY_SHOW_ID: ${{ secrets.SAVE_TO_SPOTIFY_SHOW_ID }}
        run: python -m brief.run --tts
      - name: Commit state
        run: |
          git config user.name "brief-bot"
          git config user.email "bot@local"
          git add brief/state/*.json docs/ || true
          git commit -m "brief $(date -u +%F)" || echo "no changes"
          git push
      - name: Heartbeat note
        if: success()
        run: |
          echo "Healthchecks ping is sent in-process by brief.run after a fresh brief only."
          echo "Silent-safe recover exits 0 but does not ping, so the dead-man's-switch still fires."
