[project]
name = "daily-audio-brief"
version = "0.1.0"
description = "Cloud-cron pipeline that assembles a curated daily markdown digest (plus RSS and optional MP3)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.0",
    "google-generativeai>=0.8",
    "tenacity>=8.2",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
tts = ["openai>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
brief = "brief.run:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brief*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
