# Every feed the pipeline may pull. type: arxiv | rss | s2 | graphql | gdelt | google_news
# full_text: true means the RSS body is the article (typical of free Substack).
# fetch_html: true means follow the link and strip tags if the RSS is truncated.
# weight: multiplicative prior on triage score (1.0 = default).
# Unconfirmed URLs are tagged confirmed: false and the feed-validation test flags 4xx/empty.

feeds:
  # --- Papers ---
  - id: arxiv_cs
    type: arxiv
    category: ai
    weight: 1.15
    is_paper: true
    cats: [cs.AI, cs.LG, cs.CY, cs.CL]
    max_results: 80
    confirmed: true

  - id: s2_ai_safety
    type: s2
    category: ai_safety
    weight: 1.1
    is_paper: true
    query: "AI safety OR mechanistic interpretability OR alignment"
    confirmed: true

  - id: s2_ml
    type: s2
    category: ai
    weight: 1.0
    is_paper: true
    query: "large language model reasoning"
    confirmed: true

  # --- Lab blogs (venue/announcement signal) ---
